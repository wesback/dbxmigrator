migration:
  scope: ALL
  workspace_artifacts: true
  data:
    enabled: true
  unity_catalog:
    mode: ASSESS
  assessment_only: true
  conflict_strategy: FAIL
  dry_run: true
  storage:
    plan_store: /Workspace/Shared/dbxmigrator/assessments

source:
  workspace: source-workspace-name
  region: region-a
  host: https://adb-SOURCE-WORKSPACE.azuredatabricks.net
  auth:
    type: DEFAULT

# No target section is required for assessment-only discovery.
